# SOLO PARA DESARROLLO LOCAL. En producción cada pieza se despliega por separado en Coolify
# (ver README.md). Este archivo levanta todo junto únicamente por comodidad.
#   docker compose -f docker-compose.dev.yml up --build
# Tarjeta/menú: http://localhost:8080 · Panel: http://localhost:8080/admin/ · API: http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: plebes, POSTGRES_PASSWORD: plebes, POSTGRES_DB: plebes }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U plebes"], interval: 5s, retries: 10 }

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

  backend:
    build: ./apps/backend
    depends_on: { db: { condition: service_healthy }, storage: { condition: service_started } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://plebes:plebes@db:5432/plebes
      JWT_SECRET: dev-secret-dev-secret-dev-secret-dev-secret
      CORS_ORIGINS: http://localhost:8080
      ADMIN_EMAIL: dueno@example.com
      ADMIN_PASSWORD: cambia-esta-contraseña
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: platillos
      S3_PUBLIC_URL: http://localhost:9000

  frontend:
    build: ./apps/frontend
    ports: ["8080:80"]
    environment:
      API_URL: http://localhost:3000
      SITE_URL: http://localhost:8080

volumes: { dbdata: {}, s3data: {} }
